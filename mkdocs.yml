site_name: NBA Analytics & Optimisation Engine
site_description: Documentation for the COMS3011A NBA Analytics & Optimisation Engine
repo_url: https://github.com/Sports-Analytics-Innovation-Platform/Innovation-Documentation-Website.git
edit_uri: edit/main/docs/
 
theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
    - content.action.edit

plugins:
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      effect: fade
      slide_effect: slide
      width: 90%
      height: auto
      zoomable: true
      draggable: true
      background: rgba(0, 0, 0, 0.85)

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
  - tables

extra:
  social:
    - icon: material/web
      link: https://sportsanalytics.pages.dev/
      name: Live Webapp (Cloudflare Pages)
    - icon: material/api
      link: https://sportsanalytics-api.onrender.com/health
      name: Live API (Render)
    - icon: fontawesome/brands/git
      link: https://sdp.ms.wits.ac.za/innovation/sportsanalytics
      name: Source Code (Gitea)
    - icon: material/view-dashboard
      link: https://sdp.ms.wits.ac.za/innovation/sportsanalytics/projects/8
      name: Project Board (Gitea)

nav:
  - Home:
      - Overview: index.md
      - Demo Guide: demo-guide.md
      - Rubric Quick Links: rubric-links.md
  - Getting Started: getting-started.md
  - Architecture:
      - Overview: design/architecture.md
      - ERD: design/erd.md
      - API Design: design/api-design.md
      - UI Overview: design/wireframes.md
      - Feature Tiers: design/feature-tiers.md
      - Roadmap: design/roadmap.md
  - Process:
      - Methodology: methodology.md
      - Sprint Log: sprint-log.md
      - Git Methodology: git-methodology.md
      - Definition of Done: definition-of-done.md
      - Coding Conventions: coding-conventions.md
      - CI/CD Pipeline: ci-cd.md
      - Requirements Traceability: requirements.md
      - AI Usage Ledger: ai-usage.md
  - Decisions (ADRs):
      - Index: decisions/index.md
      - "ADR-001: Database": decisions/adr-001-database.md
      - "ADR-002: Auth": decisions/adr-002-auth.md
      - "ADR-003: Hosting Topology": decisions/adr-003-hosting-topology.md
  - Tech Stack: tech-stack.md
  - Security: security.md
  - Meetings:
      - Overview: meetings/index.md
      - Client Meetings: meetings/client/index.md
      - Scrum Meetings: meetings/scrum/index.md
      - Meeting Template: meetings/_template.md
      - How to Summarise: meetings/how-to-summarize.md
