site_name: NBA Analytics & Optimisation Engine
site_description: Documentation for the COMS3011A NBA Analytics & Optimisation Engine
site_url: https://sports-analytics-innovation-platform.github.io/Innovation-Documentation-Website/
repo_url: https://github.com/Sports-Analytics-Innovation-Platform/Innovation-Documentation-Website.git
edit_uri: edit/main/docs/
 
theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
    - content.action.edit

plugins:
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      effect: fade
      slide_effect: slide
      width: 90%
      height: auto
      zoomable: true
      draggable: true
      background: rgba(0, 0, 0, 0.85)

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
  - tables

extra:
  social:
    - icon: material/web
      link: https://sportsanalytics.pages.dev/
      name: Live Webapp (Cloudflare Pages)
    - icon: material/api
      link: https://sportsanalytics-api.onrender.com/api/docs
      name: Live API (Render)
    - icon: fontawesome/brands/git
      link: https://sdp.ms.wits.ac.za/innovation/sportsanalytics
      name: Source Code (Gitea)
    - icon: material/view-dashboard
      link: https://sdp.ms.wits.ac.za/innovation/sportsanalytics/projects/8
      name: Project Board (Gitea)

