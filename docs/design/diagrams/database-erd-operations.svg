50.2805 A0,0 0 0 0 1387.3836,250.2805 L1387.3836,189.0383 L1377.3836,179.0383 L1068.45,179.0383 A0,0 0 0 0 1068.45,179.0383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1377.3836,179.0383 L1377.3836,189.0383 L1387.3836,189.0383 L1377.3836,179.0383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="291.5225" x="1074.45" y="196.6066">Deployed API queues requests when the cloud</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="297.9336" x="1074.45" y="211.9172">cannot reach stats.nba.com. The network-local</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="279.043" x="1074.45" y="227.2277">pull worker (apps/ingestion/pull_worker.py)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="177.0044" x="1074.45" y="242.5383">claims and completes them.</text></g><g class="entity" data-qualified-name="GMN36" data-source-line="161" id="ent0037"><path d="M1315.3,368.0183 L1315.3,384.2783 L1297.69,388.2783 L1315.3,392.2783 L1315.3,408.6394 A0,0 0 0 0 1315.3,408.6394 L1604.5329,408.6394 A0,0 0 0 0 1604.5329,408.6394 L1604.5329,378.0183 L1594.5329,368.0183 L1315.3,368.0183 A0,0 0 0 0 1315.3,368.0183" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1594.5329,368.0183 L1594.5329,378.0183 L1604.5329,378.0183 L1594.5329,368.0183" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="268.2329" x="1321.3" y="385.5866">The raw key is shown once at creation and</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="248.1553" x="1321.3" y="400.8972">never stored -- only its SHA-256 hash.</text></g><g class="entity" data-qualified-name="GMN39" data-source-line="165" id="ent0040"><path d="M2264.65,360.3583 L2264.65,416.2899 A0,0 0 0 0 2264.65,416.2899 L2539.1944,416.2899 A0,0 0 0 0 2539.1944,416.2899 L2539.1944,370.3583 L2529.1944,360.3583 L2439.1,360.3583 L2435.1,285.7983 L2431.1,360.3583 L2264.65,360.3583 A0,0 0 0 0 2264.65,360.3583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2529.1944,360.3583 L2529.1944,370.3583 L2539.1944,370.3583 L2529.1944,360.3583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="226.5034" x="2270.65" y="377.9266">Private to its owner. Nothing here is</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="253.5444" x="2270.65" y="393.2372">verified: a self-reported figure only ever</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="225.6401" x="2270.65" y="408.5477">reaches the person who reported it.</text></g><g class="entity" data-qualified-name="GMN42" data-source-line="170" id="ent0043"><path d="M2875.34,179.0383 L2875.34,210.2783 L2857.63,214.2783 L2875.34,218.2783 L2875.34,250.2805 A0,0 0 0 0 2875.34,250.2805 L3164.5031,250.2805 A0,0 0 0 0 3164.5031,250.2805 L3164.5031,189.0383 L3154.5031,179.0383 L2875.34,179.0383 A0,0 0 0 0 2875.34,179.0383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M3154.5031,179.0383 L3154.5031,189.0383 L3164.5031,189.0383 L3154.5031,179.0383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="268.1631" x="2881.34" y="196.6066">apps/valuation trains this bundle from the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="237.8467" x="2881.34" y="211.9172">NBA rookie dataset. The API applies it</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust=