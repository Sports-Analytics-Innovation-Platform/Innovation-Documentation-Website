81818;stroke-width:0.5;"/><path d="M1360.9199,1070.5583 L1360.9199,1080.5583 L1370.9199,1080.5583 L1360.9199,1070.5583" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.8066" x="1132.3745" y="1088.1266">ADR-003 "Neutral / follow-ups":</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="190.9375" x="1132.3745" y="1103.4372">render.yaml has no entries for</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="188.8555" x="1132.3745" y="1118.7477">these yet -- currently still run</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="223.5454" x="1132.3745" y="1134.0583">by hand from a developer machine.</text></g><!--entity pgProd--><g class="entity" data-qualified-name="supabase.pgProd" data-source-line="59" id="ent0022"><path d="M511.8545,1359.3583 C511.8545,1349.3583 615.6401,1349.3583 615.6401,1349.3583 C615.6401,1349.3583 719.4258,1349.3583 719.4258,1359.3583 L719.4258,1401.3348 C719.4258,1411.3348 615.6401,1411.3348 615.6401,1411.3348 C615.6401,1411.3348 511.8545,1411.3348 511.8545,1401.3348 L511.8545,1359.3583" fill="#FFFFFF" style="stroke:#000000;stroke-width:0.5;"/><path d="M511.8545,1359.3583 C511.8545,1369.3583 615.6401,1369.3583 615.6401,1369.3583 C615.6401,1369.3583 719.4258,1369.3583 719.4258,1359.3583" fill="none" style="stroke:#000000;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="124.0859" x="521.8545" y="1386.8934">Managed Postgres</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="187.5713" x="521.8545" y="1403.3817">(pooled via PgBouncer, TLS)</text></g><g class="entity" data-qualified-name="supabase.GMN23" data-source-line="61" id="ent0024"><path d="M754.7345,1329.4183 L754.7345,1376.3483 L719.7345,1380.3483 L754.7345,1384.3483 L754.7345,1431.2816 A0,0 0 0 0 754.7345,1431.2816 L986.5592,1431.2816 A0,0 0 0 0 986.5592,1431.2816 L986.5592,1339.4183 L976.5592,1329.4183 L754.7345,1329.4183 A0,0 0 0 0 754.7345,1329.4183" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M976.5592,1329.4183 L976.5592,1339.4183 L986.5592,1339.4183 L976.5592,1329.4183" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186.4243" x="760.7345" y="1346.9866">Auto REST/Auth/Storage APIs</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.8247" x="760.7345" y="1362.2972">deliberately unused -- the NestJS</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="197.7612" x="760.7345" y="1377.6077">API stays the only HTTP path to</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="142.4541" x="760.7345" y="1392.9183">the data, per the brief.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="190.1377" x="760.7345" y="1408.2288">Free tier: ~500MB cap, pauses</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="94.0342" x="760.7345" y="1423.5394">after inactivity.</text></g><g class="entity" data-qualified-name="google.GMN27" data-source-line="72" id="ent0028"><path d="M1506.2645,1078.2183 L1506.2645,1134.1499 L1815.0165,1134.1499 L1815.0165,1088.2183 L1805.0165,1078.2183 L1506.2645,1078.2183" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1805.0165,1078.2183 L1805.0165,1088.2183 L1815.0165,1088.2183 L1805.0165,1078.2183" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="172.1548" x="1512.2645" y="1095.7866">OAuth 2.0 (Google Sign-In)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="126.7183" x="1512.2645" y="1111.0972">Authorized redirect:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="287.752" x="1512.2645" y="1126.4077">https://&lt;api-domain&gt;/auth/callback/google</text></g><g class="entity" data-qualified-name="nbaApi.GMN31" data-source-line="80" id="ent0032"><path d="M1058.7445,1329.4183 L1058.7445,1431.2816 L1280.5526,1431.2816 L1280.5526,1339.4183 L1270.5526,1329.4183 L1058.7445,1329.4183" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1270.5526,1329.4183 L1270.5526,1339.4183 L1280.5526,1339.4183 L1270.5526,1329.4183" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="184.0947" x="1064.7445" y="1346.9866">Unofficial nba_api endpoints.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="200.8081" x="1064.7445" y="1362.2972">Blocks cloud-provider IP ranges</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="184.6343" x="1064.7445" y="1377.6077">-- ingestion must run from a</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167.3369" x="1064.7445" y="1392.9183">residential/office network,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="164.2583" x="1064.7445" y="1408.2288">a factor in it not yet being</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="159.0913" x="1064.7445" y="1423.5394">a Render Cron Job either.</text></g><!--entity viteDev--><g class="entity" data-qualified-name="devMachine.viteDev" data-source-line="90" id="ent0035"><polygon fill="#FFFFFF" points="1381.2745,93.4883,1391.2745,83.4883,1568.0147,83.4883,1568.0147,119.9766,1558.0147,129.9766,1381.2745,129.9766,1381.2745,93.4883" style="stroke:#000000;stroke-width:0.5;"/><line style="stroke:#000000;stroke-width:0.5;" x1="1558.0147" x2="1568.0147" y1="93.4883" y2="83.4883"/><line style="stroke:#000000;stroke-width:0.5;" x1="1381.2745" x2="1558.0147" y1="93.4883" y2="93.4883"/><line style="stroke:#000000;stroke-width:0.5;" x1="1558.0147" x2="1558.0147" y1="93.4883" y2="129.9766"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="146.7402" x="1396.2745" y="117.0234">Vite Dev Server :5173</text></g><!--entity localApi--><g class="entity" data-qualified-name="devMachine.localApi" data-source-line="91" id="ent0036"><polygon fill="#FFFFFF" points="1385.3045,329.6583,1395.3045,319.6583,1511.9842,319.6583,1511.9842,356.1466,1501.9842,366.1466,1385.3045,366.1466,1385.3045,329.6583" style="stroke:#000000;stroke-width:0.5;"/><line style="stroke:#000000;stroke-width:0.5;" x1="1501.9842" x2="1511.9842" y1="329.6583" y2="319.6583"/><line style="stroke:#000000;stroke-width:0.5;" x1="1385.3045" x2="1501.9842" y1="329.6583" y2="329.6583"/><line style="stroke:#000000;stroke-width:0.5;" x1="1501.9842" x2="1501.9842" y1="329.6583" y2="366.1466"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="86.6797" x="1400.3045" y="353.1934">NestJS :4000</text></g><!--entity localPg--><g class="entity" data-qualified-name="devMachine.localPg" data-source-line="92" id="ent0037"><polygon fill="#FFFFFF" points="1381.4945,570.2783,1391.4945,560.2783,1635.8011,560.2783,1635.8011,613.2548,1625.8011,623.2548,1381.4945,623.2548,1381.4945,570.2783" style="stroke:#000000;stroke-width:0.5;"/><line style="stroke:#000000;stroke-width:0.5;" x1="1625.8011" x2="1635.8011" y1="570.2783" y2="560.2783"/><line style="stroke:#000000;stroke-width:0.5;" x1="1381.4945" x2="1625.8011" y1="570.2783" y2="570.2783"/><line style="stroke:#000000;stroke-width:0.5;" x1="1625.8011" x2="1625.8011" y1="570.2783" y2="623.2548"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="169.1279" x="1396.4945" y="593.8134">Docker: postgres :55432</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="214.3066" x="1396.4945" y="610.3017">+ postgres-test :55433 (tmpfs)</text></g><!--entity ci--><g class="entity" data-qualified-name="gitea.ci" data-source-line="96" id="ent0039"><rect fill="#F1F1F1" height="55.9766" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="194.5" x="710.3945" y="314.9183"/><polygon fill="#F1F1F1" points="887.8945,319.9183,887.8945,333.9183,899.8945,333.9183,899.8945,325.9183,893.8945,319.9183,887.8945,319.9183" style="stroke:#181818;stroke-width:0.5;"/><line style="stroke:#181818;stroke-width:0.5;" x1="893.8945" x2="893.8945" y1="319.9183" y2="325.9183"/><line style="stroke:#181818;stroke-width:0.5;" x1="899.8945" x2="893.8945" y1="325.9183" y2="325.9183"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="89.8994" x="720.3945" y="341.4534">Gitea Actions</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="164.5" x="720.3945" y="357.9417">(self-hosted act_runner)</text></g><g class="entity" data-qualified-name="gitea.GMN40" data-source-line="98" id="ent0041"><path d="M939.5745,284.3183 L939.5745,338.9083 L905.3445,342.9083 L939.5745,346.9083 L939.5745,401.4921 A0,0 0 0 0 939.5745,401.4921 L1163.7122,401.4921 A0,0 0 0 0 1163.7122,401.4921 L1163.7122,294.3183 L1153.7122,284.3183 L939.5745,284.3183 A0,0 0 0 0 939.5745,284.3183" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1153.7122,284.3183 L1153.7122,294.3183 L1163.7122,294.3183 L1153.7122,284.3183" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="178.604" x="945.5745" y="301.8866">Lints/typechecks both apps,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="180.1909" x="945.5745" y="317.1972">runs both test suites against</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="137.8711" x="945.5745" y="332.5077">postgres-test service.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="203.1377" x="945.5745" y="347.8183">No deploy stage wired up yet --</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="176.5601" x="945.5745" y="363.1288">Render/Cloudflare currently</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="181.6636" x="945.5745" y="378.4394">deploy via a Gitea -&gt; GitHub</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="194.6636" x="945.5745" y="393.7499">mirror, not directly from Gitea.</text></g><!--entity user--><g class="entity" data-qualified-name="user" data-source-line="18" id="ent0002"><ellipse cx="373.6401" cy="313.1583" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M373.6401,321.1583 L373.6401,348.1583 M360.6401,329.1583 L386.6401,329.1583 M373.6401,348.1583 L360.6401,363.1583 M373.6401,348.1583 L386.6401,363.1583" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="58.8711" x="344.2045" y="378.1934">End user</text></g><g class="entity" data-qualified-name="N1" data-source-line="130" id="ent0056"><path d="M1816.3245,48.1383 L1816.3245,165.3121 L2218.9646,165.3121 L2218.9646,58.1383 L2208.9646,48.1383 L1816.3245,48.1383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2208.9646,48.1383 L2208.9646,58.1383 L2218.9646,58.1383 L2208.9646,48.1383" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="381.6401" x="1822.3245" y="65.7066">Hosting per docs/decisions/ADR-003-hosting-topology.md</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="287.8154" x="1822.3245" y="81.0172">(status: Proposed, not yet formally Accepted).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="348.7148" x="1822.3245" y="96.3277">Frontend: Cloudflare Pages. API: Render. DB: Supabase.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="326.0093" x="1822.3245" y="111.6383">Python batch jobs are the one piece of this ADR not</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="307.106" x="1822.3245" y="126.9488">yet realized -- render.yaml only declares the API</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="313.2886" x="1822.3245" y="142.2594">service, so ingestion/predictor/optimizer still run</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="363.5112" x="1822.3245" y="157.5699">manually against the same Supabase database prod uses.</text></g><!--link renderBatch to GMN18--><g class="link" data-entity-1="ent0014" data-entity-2="ent0019" data-link-type="association" data-source-line="50" id="lnk20"><path d="M1248.6445,904.7783 C1248.6445,909.2083 1248.6445,1014.0983 1248.6445,1070.3183" fill="none" id="renderBatch-GMN18" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/></g><!--link google to GMN27--><g class="link" data-entity-1="ent0026" data-entity-2="ent0028" data-link-type="association" data-source-line="72" id="lnk29"><path d="M1849.8145,1106.1783 C1838.3445,1106.1783 1826.8645,1106.1783 1815.3945,1106.178