nt-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="259.8545" x="1108.68" y="834.3434">apps/ingestion/fetch_market_odds.py</text></g><!--entity vite--><g class="entity" data-qualified-name="local.vite" data-source-line="53" id="ent0027"><rect fill="#F1F1F1" height="39.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="100.5059" x="743.35" y="187.7283"/><polygon fill="#F1F1F1" points="826.8559,192.7283,826.8559,206.7283,838.8559,206.7283,838.8559,198.7283,832.8559,192.7283,826.8559,192.7283" style="stroke:#181818;stroke-width:0.5;"/><line style="stroke:#181818;stroke-width:0.5;" x1="832.8559" x2="832.8559" y1="192.7283" y2="198.7283"/><line style="stroke:#181818;stroke-width:0.5;" x1="838.8559" x2="832.8559" y1="198.7283" y2="198.7283"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="70.5059" x="753.35" y="214.2634">Vite :5173</text></g><!--entity localApi--><g class="entity" data-qualified-name="local.localApi" data-source-line="54" id="ent0028"><rect fill="#F1F1F1" height="39.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="116.6797" x="735.26" y="307.4583"/><polygon fill="#F1F1F1" points="834.9397,312.4583,834.9397,326.4583,846.9397,326.4583,846.9397,318.4583,840.9397,312.4583,834.9397,312.4583" style="stroke:#181818;stroke-width:0.5;"/><line style="stroke:#181818;stroke-width:0.5;" x1="840.9397" x2="840.9397" y1="312.4583" y2="318.4583"/><line style="stroke:#181818;stroke-width:0.5;" x1="846.9397" x2="840.9397" y1="318.4583" y2="318.4583"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="86.6797" x="745.26" y="333.9934">NestJS :4000</text></g><!--entity localDb--><g class="entity" data-qualified-name="local.localDb" data-source-line="55" id="ent0029"><path d="M699.89,509.1883 C699.89,499.1883 781.6024,499.1883 781.6024,499.1883 C781.6024,499.1883 863.3148,499.1883 863.3148,509.1883 L863.3148,551.1648 C863.3148,561.1648 781.6024,561.1648 781.6024,561.1648 C781.6024,561.1648 699.89,561.1648 699.89,551.1648 L699.89,509.1883" fill="#FFFFFF" style="stroke:#263238;stroke-width:0.5;"/><path d="M699.89,509.1883 C699.89,519.1883 781.6024,519.1883 781.6024,519.1883 C781.6024,519.1883 863.3148,519.1883 863.3148,509.1883" fill="none" style="stroke:#263238;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="110.5029" x="709.89" y="536.7234">Docker Postgres</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="143.4248" x="709.89" y="553.2117">:55432 / test :55433</text></g><!--entity runner--><g class="entity" data-qualified-name="ci.runner" data-source-line="58" id="ent0031"><rect fill="#F1F1F1" height="39.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="185.3945" x="416.91" y="307.4583"/><polygon fill="#F1F1F1" points="585.3045,312.4583,585.3045,326.4583,597.3045,326.4583,597.3045,318.4583,591.3045,312.4583,585.3045,312.4583" style="stroke:#181818;stroke-width:0.5;"/><line style="stroke:#181818;stroke-width:0.5;" x1="591.3045" x2="591.3045" y1="312.4583" y2="318.4583"/><line style="stroke:#181818;stroke-width:0.5;" x1="597.3045" x2="591.3045" y1="318.4583" y2="318.4583"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="155.3945" x="426.91" y="333.9934">self-hosted act_runner</text></g><!--entity user--><g class="entity" data-qualified-name="user" data-source-line="19" id="ent0002"><ellipse cx="241.6055" cy="51.4883" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M241.6055,59.4883 L241.6055,86.4883 M228.6055,67.4883 L254.6055,67.4883 M241.6055,86.4883 L228.6055,101.4883 M241.6055,86.4883 L254.6055,101.4883" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="58.8711" x="212.17" y="116.5234">End user</text></g><g class="entity" data-qualified-name="GMN53" data-source-line="84" id="ent0054"><path d="M904.87,456.2783 L904.87,604.0732 L1234.3344,604.0732 L1234.3344,466.2783 L1224.3344,456.2783 L904.87,456.2783" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1224.3344,456.2783 L1224.3344,466.2783 L1234.3344,466.2783 L1224.3344,456.2783" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="257.5308" x="910.87" y="473.8466">Render deploys only the API web service.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="251.9956" x="910.87" y="489.1572">predictor/optimizer/valuation are never</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="279.3921" x="910.87" y="504.4677">spawned by the API -- they're run manually,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="271.0195" x="910.87" y="519.7783">on whatever machine an operator chooses,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="286.1587" x="910.87" y="535.0888">whenever the underlying game data changes.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="284.5083" x="910.87" y="550.3994">Only ingest.py has an automated path (direct</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="308.4644" x="910.87" y="565.7099">spawn locally, or queue + pull worker deployed),</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.2622" x="910.87" y="581.0205">because it's also triggered by the admin</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="271.6987" x="910.87" y="596.331">"Pull Data" button and the hourly schedule.</text></g><g class="entity" data-qualified-name="GMN56" data-source-line="95" id="ent0057"><path d="M475.89,1079.0083 L475.89,1180.8716 A0,0 0 0 0 475.89,1180.8716 L809.3216,1180.8716 A0,0 0 0 0 809.3216,1180.8716 L809.3216,1089.0083 L799.3216,1079.0083 L646.6,1079.0083 L642.6,1013.9783 L638.6,1079.0083 L475.89,1079.0083 A0,0 0 0 0 475.89,1079.0083" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M799.3216,1079.0083 L799.3216,1089.0083 L809.3216,1089.0083 L799.3216,1079.0083" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="312.4316" x="481.89" y="1096.5766">One shared Prisma/Postgres contract. Supabase's</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="294.5439" x="481.89" y="1111.8872">own REST/Auth APIs are not used by clients --</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="300.2378" x="481.89" y="1127.1977">the pooled Prisma connection is a service-role-</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="269.4136" x="481.89" y="1142.5083">equivalent credential (bypasses RLS), so all</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="263.1484" x="481.89" y="1157.8188">authorization is enforced in NestJS, not in</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="175.1953" x="481.89" y="1173.1294">Postgres row-level security.</text></g><g class="entity" data-qualified-name="GMN59" data-source-line="103" id="ent0060"><path d="M1646.64,947.1483 L1646.64,1018.3905 A0,0 0 0 0 1646.64,1018.3905 L1988.5585,1018.3905 A0,0 0 0 0 1988.5585,1018.3905 L1988.5585,957.1483 L1978.5585,947.1483 L1821.6,947.1483 L1817.6,856.0183 L1813.6,947.1483 L1646.64,947.1483 A0,0 0 0 0 1646.64,947.1483" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1978.5585,947.1483 L1978.5585,957.1483 L1988.5585,957.1483 L1978.5585,947.1483" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="320.9185" x="1652.64" y="964.7166">Runs on any machine that can reach stats.nba.com</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="284.2227" x="1652.64" y="980.0272">(deployed Render IPs are blocked). Orphaned</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="287.9297" x="1652.64" y="995.3377">RUNNING requests from a crashed worker are</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="272.8032" x="1652.64" y="1010.6483">marked FAILED on the next worker startup.</text></g><!--link user to web--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency" data-source-line="61" id="lnk32"><path d="M241.6,119.7983 C241.6,138.9383 241.6,155.6483 241.6,173.1583" fill="none" id="user-to-web" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="241.6,179.1583,245.6,170.1583,241.6,174.1583,237.6,170.1583,241.6,179.1583" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="40.1807" x="200.6" y="146.0466">HTTPS</text></g><!--link web to functionsProxy--><g class="link" data-entity-1="ent0004" data-entity-2="ent0006" data-link-type="dependency" data-source-line="62" id="lnk33"><path d="M241.6,235.8483 C241.6,254.9283 241.6,273.9883 241.6,293.0283" fill="none" id="web-to-functionsProxy" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="241.6,299.0283,245.6,290.0283,241.6,294.0283,237.6,290.0283,241.6,299.0283" style="stroke:#181818;stroke-w